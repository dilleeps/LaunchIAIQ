services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchiq
      POSTGRES_PASSWORD: launchiq
      POSTGRES_DB: launchiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

  # Phase 2: SAML/OIDC SSO broker
  # keycloak:
  #   image: quay.io/keycloak/keycloak:24.0
  #   command: start-dev
  #   environment:
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #   ports:
  #     - "8082:8080"

volumes:
  postgres_data:
